# Builds the Next.js image off-box and pushes it to GHCR; Coolify on
# 148.113.255.170 only pulls and runs it.
name: Coolify image

on:
  push:
    branches: [deploy/coolify]
  workflow_dispatch:

concurrency:
  group: coolify-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aminofabian/squlll

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:coolify
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            GRAPHQL_API_URL=https://skool.zelisline.com/graphql
            NEXT_PUBLIC_API_BASE_URL=https://skool.zelisline.com/graphql
            NEXT_PUBLIC_API_URL=https://squl.co.ke/api
            NEXT_PUBLIC_WS_URL=https://skool.zelisline.com
            NEXT_PUBLIC_GRAPHQL_API_URL=/api/graphql
            NEXT_PUBLIC_SITE_URL=https://www.squl.co.ke

      - name: Trigger Coolify deploy
        env:
          WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ] || [ -z "$TOKEN" ]; then
            echo "Coolify webhook not configured; deploy manually."
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $TOKEN" "$WEBHOOK"

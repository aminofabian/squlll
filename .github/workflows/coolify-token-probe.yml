name: Coolify token probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Coolify hosts
        env:
          TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then echo "::error::missing token"; exit 1; fi
          for BASE in http://202.61.227.1:8000 http://148.113.255.170:8000; do
            echo "--- $BASE"
            CODE=$(curl -sS --max-time 15 -o /tmp/apps.json -w "%{http_code}" -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" "$BASE/api/v1/applications" || true)
            echo "status $CODE"
            if [ "$CODE" = "200" ]; then
              jq -r 'if type == "array" then .[] else (.data // [])[] end | [.uuid, .name, (.fqdn // "")] | @tsv' /tmp/apps.json
            fi
          done

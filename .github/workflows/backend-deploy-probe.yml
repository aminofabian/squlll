name: Backend deploy probe

on:
  workflow_dispatch:
    inputs:
      app_uuid:
        description: Coolify app UUID to deploy (leave blank to list apps)
        required: false
      confirm:
        description: Type deploy to actually trigger a deployment
        required: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List or deploy
        env:
          WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          APP_UUID: ${{ inputs.app_uuid }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ] || [ -z "${TOKEN:-}" ]; then
            echo "::error::Coolify secrets are missing"
            exit 1
          fi
          BASE="${WEBHOOK%/api/v1/*}"
          echo "Coolify host: $BASE"
          APPS=$(curl -fsS -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" "$BASE/api/v1/applications")
          echo "$APPS" | jq -r 'if type == "array" then .[] else (.data // [])[] end | [.uuid, .name, (.status // "")] | @tsv'
          if [ -n "${APP_UUID:-}" ]; then
            if [ "${CONFIRM:-}" != "deploy" ]; then
              echo "::error::Set confirm=deploy to trigger a deployment"
              exit 1
            fi
            curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" "$BASE/api/v1/deploy?uuid=$APP_UUID&force=false"
            echo "Deploy triggered for $APP_UUID"
          fi

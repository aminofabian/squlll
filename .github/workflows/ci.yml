# Type-check and unit-test the Next.js app on every push / PR.
#
# The super-admin auth smoke test needs a running deployment, so it only runs
# when a target and credentials are configured via repo secrets
# (SMOKE_BASE_URL / SMOKE_EMAIL / SMOKE_PASSWORD). Otherwise the script exits 0
# with a SKIP notice, so forks and credential-less runs stay green.
name: CI

on:
  push:
    branches: [main, master, deploy/coolify]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      - name: Type check
        run: bunx tsc --noEmit

      - name: Super-admin auth smoke test
        if: env.SMOKE_BASE_URL != ''
        run: node scripts/smoke-superadmin-auth.mjs

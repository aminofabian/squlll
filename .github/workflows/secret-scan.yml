# Scan every tracked file for committed secrets (provider keys, private keys,
# JWTs, password-bearing URLs, sensitive assignments, high-entropy values).
#
# Dependency-free: it only needs node + a git checkout, so it runs before any
# install and can't be broken by a flaky package registry. Mirrors the local
# pre-commit hook (.githooks/pre-commit) — see README for per-clone setup.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for secrets
        run: node scripts/scan-secrets.mjs --all

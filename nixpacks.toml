# Prefer the Dockerfile for Coolify. Kept so accidental Nixpacks deploys
# still run Next correctly (previous start cmd pointed at Nest build/index.js).
[phases.setup]
nixPkgs = ['bun', 'nodejs_22']

[phases.install]
cmds = ['bun install --frozen-lockfile']

[phases.build]
cmds = ['bun run build']

[start]
cmd = 'bun run start:prod -- -p 3000 -H 0.0.0.0'
